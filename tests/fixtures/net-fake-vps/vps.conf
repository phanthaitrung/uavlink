# A local fake of the VPS relay (same endpoint kinds as the real one, other ports). See config.env next to it.
[General]
TcpServerPort = 25760
ReportStats = false
MavlinkDialect = ardupilotmega

# CM5 -> VPS
[UdpEndpoint uplink]
Mode = Server
Address = 127.0.0.1
Port = 24555

# GCS over UDP
[UdpEndpoint gcs]
Mode = Server
Address = 127.0.0.1
Port = 24551
