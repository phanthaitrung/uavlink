# Tạo bởi cm5-x25-install/cm5/install-cm5.sh. Đừng sửa tay: sửa config.env rồi chạy lại.
[General]
TcpServerPort = 5760
MavlinkDialect = ardupilotmega
ReportStats = false
Log = /var/log/mavlink-router
LogMode = while-armed

# X25 EVO (NET_P1_TYPE = UDP Client) gửi tới 192.168.50.2:14550
[UdpEndpoint x25_ethernet]
Mode = Server
Address = 0.0.0.0
Port = 14550

# Đẩy lên VPS relay
[UdpEndpoint vps_mavlink]
Mode = Normal
Address = 209.97.167.92
Port = 14555

[UdpEndpoint ground_station_office]
Mode = Normal
Address = 100.70.184.3
Port = 14550
