name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Tests
        run: bash tools/test.sh

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper devscripts lintian git xz-utils iproute2 \
            g++ meson ninja-build pkgconf

      - name: Build uavlink (arch all)
        run: bash tools/build-deb.sh

      - name: Build uavlink-router
        run: bash packaging/uavlink-router/build.sh

      - name: Lintian
        run: |
          for c in out/uavlink_*.changes out/uavlink-router_*.changes; do
            echo "== $c"
            lintian --fail-on error --tag-display-limit 0 "$c"
          done

      - name: Install test
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ./out/*.deb
          uavlink --version
          units="$(dpkg -L uavlink uavlink-router | grep -E '\.service$' | sort -u)"
          echo "$units"
          test -n "$units"
          for u in $units; do
            name="$(basename "$u")"
            test -f "$u"
            if systemctl is-enabled --quiet "$name"; then echo "$name is enabled after install" >&2; exit 1; fi
            if systemctl is-active --quiet "$name"; then echo "$name is running after install" >&2; exit 1; fi
          done
          dpkg -L uavlink uavlink-router | sort -u > /tmp/installed-paths
          sudo apt-get purge -y uavlink uavlink-router
          left=0
          while read -r p; do
            if [ -f "$p" ] || [ -L "$p" ]; then echo "left behind: $p" >&2; left=1; fi
          done < /tmp/installed-paths
          if dpkg -l uavlink uavlink-router 2>/dev/null | grep -E '^(ii|rc|hi)'; then echo "package state not clean" >&2; left=1; fi
          sudo dpkg --audit
          exit "$left"

      - name: Upload packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: debs-${{ matrix.runner }}
          path: out/*.deb
          if-no-files-found: error
